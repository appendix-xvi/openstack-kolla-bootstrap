---
- name: Prepare hosts for Kolla-Ansible
  hosts: all:!deployment
  become: true
  gather_facts: true
  tasks:
    - name: Ensure required base packages are present
      package:
        name:
          - python3
          - python3-pip
          - python3-venv
          - curl
          - git
        state: present

    - name: Ensure Docker package is present
      package:
        name: docker.io
        state: present

    - name: Ensure Docker service is enabled and running
      service:
        name: docker
        state: started
        enabled: true

    - name: Ensure br_netfilter module is loaded
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Set bridge iptables sysctls
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
